name: CI

# يشغّل الاختبارات ويبني الموقع مع كل PR وكل دمج في main — أي تعديل يكسر
# التسجيل أو الدفع أو الطلبات (أو يكسر البناء) ينكشف هنا قبل ما يوصل للموقع.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
      - name: Syntax check server functions
        run: for f in api/*.js lib/*.js scripts/*.mjs; do node --check "$f" || exit 1; done
      - name: Build
        run: npm run build
