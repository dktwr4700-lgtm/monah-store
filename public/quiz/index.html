<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وش تبيع؟ اختبار مونة</title>
<meta name="description" content="خمسة أسئلة تطلع لك فكرة منتج رقمي تقدر تبيعه وكيف تبدأ فيه.">
<meta property="og:title" content="ما تعرف وش تبيع؟">
<meta property="og:description" content="اختبار مجاني من مونة يقترح عليك منتجًا رقميًا يناسب شغلك وأسلوبك.">
<meta property="og:image" content="https://monah-app.com/icon-512.png">
<meta name="theme-color" content="#163A2B">
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;600&display=swap">
<style>
/* Layout: a printed booklet, not an app. Each step is a full page; the question is set large in a book naskh, answers are plain lines of text that get a lime highlighter stroke when chosen. No boxes, no borders, no shadows. Intro and result flip to the deep green page. Deliberately single-theme. */
:root {
  --paper: #F3EEE1;
  --green: #163A2B;
  --green-ink: #2F6B4F;
  --lime: #D6F25B;
  --muted: #6B7A6F;
  --cream-ink: #EDE8D8;
  --cream-muted: #A9BAAE;
  --display: "Amiri", "Times New Roman", serif;
  --text: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--green); font-family: var(--text); font-weight: 300; }
.page { min-height: 100vh; min-height: 100dvh; padding-inline: 24px; padding-block: 26px 48px; display: flex; flex-direction: column; }
.page.dark { background: var(--green); color: var(--cream-ink); }
.inner { width: 100%; max-width: 560px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
.mast { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; letter-spacing: .02em; }
.mast a { color: inherit; text-decoration: none; font-family: var(--display); font-size: 26px; font-weight: 700; }
.mast .count { font-family: var(--display); font-size: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dark .mast .count { color: var(--cream-muted); }
.mark { background: linear-gradient(transparent 52%, var(--lime) 52%, var(--lime) 88%, transparent 88%); padding-inline: 6px; color: inherit; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.dark .mark { color: var(--green); background: linear-gradient(transparent 22%, var(--lime) 22%, var(--lime) 92%, transparent 92%); }
.display { font-family: var(--display); font-weight: 700; font-size: clamp(46px, 13vw, 76px); line-height: 1.4; margin: 0; text-wrap: balance; }
.q { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 9vw, 52px); line-height: 1.25; margin: 0; text-wrap: balance; }
.prose { font-size: 18px; line-height: 1.9; max-width: 36ch; margin: 0; }
.dark .prose { color: var(--cream-muted); }
.prose b { font-weight: 600; color: var(--cream-ink); }
.spacer { flex: 1; min-height: 28px; }
.lead-gap { height: clamp(48px, 12vh, 110px); }

.start { align-self: flex-start; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 32px; color: var(--lime); border-bottom: 3px solid var(--lime); line-height: 1.5; }
.small { font-size: 14px; color: var(--cream-muted); margin-top: 14px; }

.answers { list-style: none; margin: 36px 0 0; padding: 0; display: grid; gap: 22px; }
.answers button { background: none; border: 0; padding: 0; cursor: pointer; text-align: start; color: var(--green); font-family: var(--text); font-size: 21px; font-weight: 400; line-height: 1.5; }
.answers button span { background: linear-gradient(var(--lime), var(--lime)) no-repeat right 78% / 0% 38%; transition: background-size .28s ease; padding-inline: 2px; }
.answers button:hover span, .answers button:focus-visible span { background-size: 100% 38%; }
.answers button.on span { background-size: 100% 100%; }
.answers small { display: block; font-size: 15px; color: var(--muted); font-weight: 300; margin-top: 2px; }
.back { align-self: flex-start; background: none; border: 0; padding: 0; margin-top: 30px; cursor: pointer; font: 400 15px var(--text); color: var(--muted); }
button:focus-visible, a:focus-visible { outline: 2px dashed var(--green-ink); outline-offset: 6px; }
.dark button:focus-visible, .dark a:focus-visible { outline-color: var(--lime); }

.label { font-size: 15px; color: var(--cream-muted); letter-spacing: .02em; margin-bottom: 10px; }
.ways { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 24px; counter-reset: w; }
.ways li { counter-increment: w; display: grid; grid-template-columns: 44px 1fr; align-items: baseline; }
.ways li::before { content: counter(w); font-family: var(--display); font-size: 34px; color: var(--lime); line-height: 1; }
.ways a { color: var(--cream-ink); text-decoration: none; font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.35; }
.ways a i { font-style: normal; color: var(--lime); margin-inline-start: 6px; }
.ways p { grid-column: 2; margin: 4px 0 0; font-size: 15.5px; line-height: 1.7; color: var(--cream-muted); }
.foot { font-size: 13px; line-height: 1.8; color: var(--cream-muted); margin-top: 34px; max-width: 44ch; }
.again { background: none; border: 0; padding: 0; margin-top: 18px; cursor: pointer; color: var(--cream-muted); font: 400 15px var(--text); text-decoration: underline; text-underline-offset: 5px; }
@media (prefers-reduced-motion: reduce) { .answers button span { transition: none; } }
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar"></div>

<script>
const WA = "96876630905";
const Q = [
  { key: "field", q: "وش شغلك أو المجال اللي تعرفه زين؟", opts: [
    ["teach", "التعليم", "معلم أو مدرّس خصوصي أو طالب متفوق"],
    ["design", "التصميم", "دعوات أو سوشال ميديا أو جرافيك"],
    ["cook", "الطبخ والحلويات", "وصفات البيت والعزايم"],
    ["fit", "الرياضة والصحة", "تمارين أو تغذية"],
    ["office", "الشغل المكتبي", "إكسل أو محاسبة أو إدارة"],
    ["photo", "التصوير", "بالجوال أو بالكاميرا"],
    ["other", "شي ثاني", "خبرة أو هواية تتقنها"],
  ]},
  { key: "ask", q: "وش أكثر شي يطلبه منك الناس؟", opts: [
    ["explain", "يبوني أشرح لهم", ""],
    ["recipe", "يبون نسخة من شي سويته", "وصفة أو جدول أو ملف"],
    ["tips", "يبون رأيي ونصيحتي", ""],
    ["none", "ما أدري أول مرة أفكر فيها", ""],
  ]},
  { key: "style", q: "كيف ترتاح تقدّم اللي تعرفه؟", opts: [
    ["write", "أكتب", "ملفات ومذكرات"],
    ["visual", "أصمّم", "قوالب وجداول"],
    ["video", "أسجّل فيديو", "أشرح وأنا أصوّر"],
  ]},
  { key: "time", q: "كم من وقتك تقدر تعطيه هالأسبوع؟", opts: [
    ["low", "ساعة أو ساعتين", ""],
    ["mid", "يوم تقريبًا", ""],
    ["high", "أكثر من يوم", ""],
  ]},
  { key: "who", q: "ومين بيشتري منك؟", opts: [
    ["students", "طلاب وأولياء أمور", ""],
    ["women", "أمهات وربّات بيوت", ""],
    ["youth", "شباب وبنات", ""],
    ["biz", "أصحاب محلات ومشاريع", ""],
  ]},
];

const PRODUCTS = {
  teach:  { write: ["ملخصات ومذكرات", "ملخص فصل واحد لمادة تدرّسها", "1 و 3 ر.ع"], visual: ["أوراق عمل للطباعة", "عشر أوراق عمل لدرس واحد", "1 و 2 ر.ع"], video: ["شرح بالفيديو", "فيديو عشر دقايق لأصعب درس", "2 و 5 ر.ع"] },
  design: { write: ["دليل «صمّم بنفسك»", "دليل خطوات لتصميم شي واحد", "2 و 4 ر.ع"], visual: ["قوالب دعوات جاهزة", "ثلاث قوالب دعوات قابلة للتعديل", "1 و 4 ر.ع"], video: ["دورة تصميم قصيرة", "درس فيديو عن أداة وحدة", "5 و 15 ر.ع"] },
  cook:   { write: ["كتيّب وصفات", "عشر وصفات من أشهر وصفاتك", "1 و 3 ر.ع"], visual: ["كتيّب وصفات مصوّر", "عشر وصفات مع صورها", "2 و 4 ر.ع"], video: ["وصفات بالفيديو", "ثلاث فيديوهات لأشهر أطباقك", "3 و 8 ر.ع"] },
  fit:    { write: ["نظام غذائي مكتوب", "خطة أكل لأسبوعين", "2 و 5 ر.ع"], visual: ["جدول تمارين ٣٠ يوم", "جدول شهر للمبتدئين", "2 و 4 ر.ع"], video: ["تمارين بالفيديو", "خمس فيديوهات تمارين في البيت", "3 و 10 ر.ع"] },
  office: { write: ["دليل عملي", "دليل لمهارة وحدة تتقنها", "2 و 4 ر.ع"], visual: ["قوالب إكسل جاهزة", "قالب ميزانية للبيت أو للفواتير", "1 و 3 ر.ع"], video: ["دورة إكسل قصيرة", "ثلاث دروس لأهم الدوال", "5 و 15 ر.ع"] },
  photo:  { write: ["دليل التصوير بالجوال", "عشر نصايح مع أمثلة", "1 و 3 ر.ع"], visual: ["فلاتر جاهزة للصور", "خمس فلاتر بنفس الطابع", "1 و 3 ر.ع"], video: ["دورة تصوير قصيرة", "درس فيديو عن الإضاءة", "3 و 10 ر.ع"] },
  other:  { write: ["دليل من خبرتك", "دليل قصير لأكثر سؤال ينسأل لك", "1 و 3 ر.ع"], visual: ["قالب أو جدول جاهز", "قالب يحل مشكلة وحدة", "1 و 3 ر.ع"], video: ["شرح بالفيديو", "فيديو عشر دقايق لأهم شي تعرفه", "2 و 5 ر.ع"] },
};
const WHO = { students: "للطلاب وأولياء الأمور", women: "للأمهات وربّات البيوت", youth: "للشباب والبنات", biz: "لأصحاب المحلات والمشاريع" };
const TIME = { low: "ساعتين تكفي لنسخة أولى بسيطة.", mid: "يوم واحد يكفي تخلّصه وترفعه.", high: "وعندك وقت تجهّز معه منتجك الثاني." };

let step = 0, answers = {};
const app = document.getElementById("app");
const wa = (t) => `https://wa.me/${WA}?text=${encodeURIComponent(t)}`;
const mast = (count) => `<div class="mast"><a href="/">مونة</a>${count || ""}</div>`;

function intro() {
  app.innerHTML = `<section class="page dark"><div class="inner">
    ${mast()}
    <div class="lead-gap"></div>
    <h1 class="display">ما تعرف<br><span class="mark">وش تبيع؟</span></h1>
    <p class="prose" style="margin-top:22px">خمسة أسئلة وتطلع لك فكرة منتج رقمي تقدر تبيعه من اللي تعرفه وكيف تبدأ فيه.</p>
    <div class="spacer"></div>
    <button class="start" id="start" type="button">ابدأ ←</button>
    <div class="small">دقيقة وحدة وبدون تسجيل.</div>
  </div></section>`;
  document.getElementById("start").onclick = () => { step = 0; question(); };
  window.scrollTo(0, 0);
}

function question() {
  const item = Q[step];
  app.innerHTML = `<section class="page"><div class="inner">
    ${mast(`<span class="count" dir="ltr">${step + 1} / ${Q.length}</span>`)}
    <div class="lead-gap"></div>
    <h1 class="q">${item.q}</h1>
    <ul class="answers">${item.opts.map(([v, t, s]) => `<li><button type="button" data-v="${v}"><span>${t}</span>${s ? `<small>${s}</small>` : ""}</button></li>`).join("")}</ul>
    ${step ? `<button class="back" type="button" id="back">→ السؤال اللي قبل</button>` : ""}
  </div></section>`;
  app.querySelectorAll(".answers button").forEach((b) => b.onclick = () => {
    b.classList.add("on");
    answers[item.key] = b.dataset.v;
    setTimeout(() => { step++; step < Q.length ? question() : result(); }, 260);
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => { step--; question(); };
  window.scrollTo(0, 0);
}

function result() {
  const style = answers.ask === "recipe" && answers.style === "write" ? "visual" : answers.style;
  const [name, first, price] = PRODUCTS[answers.field][style];
  const who = WHO[answers.who];
  const [lo, hi] = price.split(" و ");
  const msg = (path) => `هلا مونة 👋\nنتيجتي في الاختبار: ${name} ${who}.\n${path}`;
  app.innerHTML = `<section class="page dark"><div class="inner">
    ${mast()}
    <div class="lead-gap"></div>
    <div class="label">منتجك</div>
    <h1 class="display"><span class="mark">${name}</span></h1>
    <p class="prose" style="margin-top:22px">${who}. ابدأ بـ<b>${first}</b> وبيعه بين <b>${lo}</b> و<b>${hi}</b> تقريبًا. ${TIME[answers.time]}</p>
    <ol class="ways">
      <li><a target="_blank" rel="noopener" href="${wa(msg("أبي القالب الجاهز وأسويه بنفسي."))}">أسويه بنفسي<i>←</i></a><p>نرسل لك قالب جاهز وتكتب فيه محتواك بس.</p></li>
      <li><a target="_blank" rel="noopener" href="${wa(msg("أبي أتعلم الطريقة أرسلوا لي الدرس الأول."))}">أتعلم الطريقة<i>←</i></a><p>دروس قصيرة والأول مجاني.</p></li>
      <li><a target="_blank" rel="noopener" href="${wa(msg("ما عندي وقت أبيكم تسوونه لي."))}">سوّوه لي<i>←</i></a><p>ترسل لنا محتواك ونجهز منتجك ومتجرك.</p></li>
    </ol>
    <p class="foot">كل اختيار يفتح الواتساب برسالة فيها نتيجتك. الأسعار تقريبية وأنت تحدد سعرك.</p>
    <button class="again" type="button" id="again">أعد الاختبار</button>
  </div></section>`;
  document.getElementById("again").onclick = () => { answers = {}; intro(); };
  window.scrollTo(0, 0);
}

intro();
</script>
</body>
</html>
